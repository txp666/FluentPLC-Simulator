name: CI
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true
      - uses: seanmiddleditch/gha-setup-ninja@v5
        if: runner.os != 'Windows'
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1
      - name: Configure
        if: runner.os == 'Linux'
        run: cmake --preset release
      - name: Configure macOS universal
        if: runner.os == 'macOS'
        run: cmake --preset release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Configure MSVC
        if: runner.os == 'Windows'
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -DFPLC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/release --config Release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/release -C Release --output-on-failure --no-tests=error
      - name: Validate example
        if: runner.os != 'Windows'
        run: build/release/FluentPLCServer --project examples/hmi-demo.plcsim.json --check
      - name: Validate example on Windows
        if: runner.os == 'Windows'
        run: build/release/Release/FluentPLCServer.exe --project examples/hmi-demo.plcsim.json --check
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < build/release/FluentPLCSimulator-version.txt)"
          test "${GITHUB_REF_NAME%%-*}" = "v${version}"
      - name: Package for updates
        run: python scripts/package.py --build-dir build/release --output-dir dist --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*.zip*
            dist/*.deb*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" --title "FluentPLC Simulator ${GITHUB_REF_NAME}" --generate-notes
